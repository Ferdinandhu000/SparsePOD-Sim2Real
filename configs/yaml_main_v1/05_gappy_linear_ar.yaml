# Trainable Gappy-POD + linear modal autoregressive baseline
exp_name: "05_gappy_linear_ar"
model_name: "gappy_linear_ar"

data_root: "data/foil"
manifest_dir: "manifests"
allow_manifest_fallback: false
model_init_seed: 42
few_shot_traj_seed: 101
sensor_placement_seed: 202
num_workers: 4
pin_memory: true
trajectory_locality_batches: 8
val_selection_strategy: "dense_val"
log_every_n_steps: 50
grid_dx: 1.0
grid_dy: 1.0
grid_h: 64
grid_w: 128
in_step: 20
out_step: 20
interval: 5

num_sensors: 64
sensor_topology: "group_q_deim"
pod_rank: 64
reg_lambda: 0.0001
sim_pretrain_full: true
real_finetune_scope: adaptation_dynamics
supervision_mode: sparse_sensors

batch_size: 32
weight_decay: 0.0001
clip_grad_norm: 1.0
patience: 10
v_weight: 2.0
vorticity_weight: 0.1
ortho_weight: 0.0

sim_epochs: 100
sim_lr: 0.0002
real_epochs: 50
real_lr: 0.0001
few_shot_k: 3
