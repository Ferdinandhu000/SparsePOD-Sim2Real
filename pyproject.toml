[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse_pod_sim2real"
version = "0.1.0"
description = "Few-shot Extreme-Sparse to Full-field Sim2Real Transfer Framework with Modal Priors"
readme = "README.md"
authors = [{ name = "AI4Science Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "pandas>=1.4.0",
    "openpyxl>=3.0.0",
    "pyarrow>=10.0.0",
    "h5py>=3.7.0",
    "einops>=0.6.0",
    "einops-exts>=0.0.4",
    "rotary-embedding-torch>=0.3.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
