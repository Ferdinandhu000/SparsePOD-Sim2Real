# Classical Gappy-POD Zero-shot Baseline Configuration
exp_name: "03_classical_gappy_pod"
model_name: "classical_gappy_pod"

# Data & Spatial Resolution
data_root: "data/foil"
manifest_dir: "manifests"
allow_manifest_fallback: false
model_init_seed: 42
few_shot_traj_seed: 101
sensor_placement_seed: 202
num_workers: 4
pin_memory: true
trajectory_locality_batches: 8
val_selection_strategy: "dense_val"
log_every_n_steps: 50
# Isotropic grid-cell units (the raw Sim/Real coordinates use different units).
grid_dx: 1.0
grid_dy: 1.0
grid_h: 64
grid_w: 128
in_step: 20
out_step: 20
interval: 10

# Sensor Topology & Sparsity
num_sensors: 64
sensor_topology: "group_q_deim"

# POD Hyperparameters
pod_rank: 64
reg_lambda: 0.0001

# No deep training needed for classical analytical baseline
sim_epochs: 0
real_epochs: 0
batch_size: 8
