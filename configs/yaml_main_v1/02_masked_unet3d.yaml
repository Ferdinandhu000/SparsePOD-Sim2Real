# Masked-UNet3D Official Baseline Configuration
exp_name: "01_masked_unet3d"
model_name: "masked_unet3d"

# Data & Spatial Resolution
data_root: "data/foil"
manifest_dir: "manifests"
allow_manifest_fallback: false
model_init_seed: 42
few_shot_traj_seed: 101
sensor_placement_seed: 202
num_workers: 4
pin_memory: true
trajectory_locality_batches: 8
val_selection_strategy: "dense_val"
log_every_n_steps: 50
# Isotropic grid-cell units (the raw Sim/Real coordinates use different units).
grid_dx: 1.0
grid_dy: 1.0
grid_h: 64
grid_w: 128
in_step: 20
out_step: 20
interval: 5

# Sensor Topology & Sparsity
num_sensors: 64
sensor_topology: "group_q_deim"  # same probes as the proposed model for fairness
sparse_fill_method: "voronoi"  # zero or voronoi; input imputation for masked baselines

# Model Architecture (23.0M Parameters aligned with RealPDEBench)
unet_dim: 64
dim_mults: [1, 2, 4]

# Training Protocol
batch_size: 8
weight_decay: 0.0001
clip_grad_norm: 1.0
patience: 10

# Stage 1: Sim Pre-training
sim_epochs: 100
sim_lr: 0.0002

# Stage 2: Few-shot Real Fine-tuning
real_epochs: 50
real_lr: 0.0001
few_shot_k: 3  # Only 3 real trajectories used for fine-tuning
