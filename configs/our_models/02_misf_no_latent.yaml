# Decoupled SOTA Architecture: MISF-NO (Dual-Path + Latent Dynamics + Subspace Warping)
exp_name: "02_misf_no_latent"
model_name: "misf_no"

# Data & Spatial Resolution
data_root: "data/foil"
grid_h: 64
grid_w: 128
in_step: 20
out_step: 20
interval: 5

# Sensor Topology & Sparsity
num_sensors: 64
sensor_topology: "wall"

# Dual-Path & Latent Space Configuration
pod_rank: 64
reg_lambda: 0.0001
latent_dim: 128
use_warping: true

# Optimization
batch_size: 16
weight_decay: 0.0001
clip_grad_norm: 1.0
patience: 10

# Physics-informed Loss Weights
v_weight: 2.0
vorticity_weight: 0.1

# Stage 1: Sim Pre-training
sim_epochs: 100
sim_lr: 0.0003

# Stage 2: Few-shot Real Fine-tuning
real_epochs: 50
real_lr: 0.0001
few_shot_k: 3
