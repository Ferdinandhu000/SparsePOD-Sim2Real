# Capacity control: same dense-POD/modal/Grassmann path with a small residual backbone.
exp_name: "ablation_pod_res_small_backbone"
model_name: "pod_res_unet3d"
data_root: "data/foil"
manifest_dir: "manifests"
allow_manifest_fallback: false
model_init_seed: 42
few_shot_traj_seed: 101
sensor_placement_seed: 202
num_workers: 4
pin_memory: true
trajectory_locality_batches: 8
val_selection_strategy: "dense_val"
log_every_n_steps: 50
# Isotropic grid-cell units; see the primary config for rationale.
grid_dx: 1.0
grid_dy: 1.0
grid_h: 64
grid_w: 128
in_step: 20
out_step: 20
interval: 5
num_sensors: 64
sensor_topology: "group_q_deim"
pod_rank: 64
reg_lambda: 0.0001
use_warping: true
residual_weight: 1.0
unet_dim: 32
dim_mults: [1, 2]
sim_pretrain_full: true
real_finetune_scope: adaptation
supervision_mode: sparse_sensors
batch_size: 8
weight_decay: 0.0001
clip_grad_norm: 1.0
patience: 10
v_weight: 2.0
vorticity_weight: 0.1
sim_epochs: 100
sim_lr: 0.0002
real_epochs: 50
real_lr: 0.0001
few_shot_k: 3
